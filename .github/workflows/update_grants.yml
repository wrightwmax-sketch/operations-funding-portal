name: Daily Grant Intelligence Update

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

permissions:
  contents: write

jobs:
  update-grants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch and Analyze Daily Grants
        run: |
          python fetch_grants.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "GrantBot"
          git config --global user.email "bot@github.actions"
          git add grants.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update grant intelligence feed [skip ci]" && git push)
